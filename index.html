<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>don't click me 🐣</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF6EC;
    --blush: #FFE1E8;
    --pink: #FFB5C5;
    --rose: #FF5C8A;
    --rose-deep: #E23E6D;
    --yellow: #FFD43B;
    --orange: #FF9F1C;
    --ink: #4A2C2A;
    --paper: #FFFBF5;
    --night-1: #2B1055;
    --night-2: #7A2A6B;
    --night-3: #FF6F91;
    --font-ui: "Fredoka", "Noto Sans Georgian", ui-rounded, system-ui, sans-serif;
    --font-hand: "Caveat", "Noto Sans Georgian", cursive;
    --him: 200px;
    --her: 140px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--cream);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- stage 1: the chicks ---------- */

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px 16px;
    background:
      radial-gradient(circle at 15% 20%, #FFE7A8 0, transparent 38%),
      radial-gradient(circle at 85% 80%, var(--blush) 0, transparent 45%),
      radial-gradient(circle at 80% 10%, #FFEFD9 0, transparent 35%),
      var(--cream);
    transition: transform .9s cubic-bezier(.6,-0.3,.7,1), opacity .7s ease .2s, filter .7s;
  }

  #stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 92, 138, .14) 1.5px, transparent 1.6px);
    background-size: 26px 26px;
    pointer-events: none;
  }

  .floaty {
    position: absolute;
    bottom: -40px;
    color: var(--pink);
    opacity: .55;
    pointer-events: none;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .55; }
    100% { transform: translateY(-110vh) rotate(40deg); opacity: 0; }
  }

  .speech {
    position: relative;
    z-index: 4;
    max-width: min(300px, 80vw);
    min-height: 1em;
    padding: 12px 18px;
    background: #fff;
    border-radius: 20px;
    font-size: 1.15rem;
    font-weight: 500;
    text-align: center;
    box-shadow: 0 6px 0 rgba(74, 44, 42, .08), 0 12px 30px rgba(255, 92, 138, .15);
    transition: translate .45s cubic-bezier(.3,1.6,.5,1);
  }

  .speech::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -10px;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 0 0 6px 0;
    transform: translateX(-50%) rotate(45deg);
  }

  .speech.pop { animation: pop .35s cubic-bezier(.3,1.6,.5,1); }

  @keyframes pop {
    0%   { transform: scale(.6); opacity: 0; }
    100% { transform: scale(1);  opacity: 1; }
  }

  .duo {
    position: relative;
    z-index: 1;
    width: 100%;
    height: var(--him);
  }

  .chick-wrap {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: var(--him);
    height: var(--him);
    cursor: pointer;
    transform: translateX(calc(-50% + var(--hx, 0px))) scale(var(--grow, 1));
    transform-origin: 50% 100%;
    transition: transform .45s cubic-bezier(.3,1.6,.5,1);
  }

  .her-wrap {
    position: absolute;
    left: 50%;
    bottom: 0;
    z-index: 2;
    width: var(--her);
    height: var(--her);
    cursor: pointer;
    transform: translateX(calc(-50% + var(--sx, 0px)));
    transition: transform .45s cubic-bezier(.3,1.6,.5,1);
  }

  .chick-wrap svg, .her-wrap svg { width: 100%; height: 100%; overflow: visible; display: block; }

  #chick, #herChick { animation: idle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 95%; }
  #herChick { animation-delay: -1.2s; }

  @keyframes idle {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-6px) rotate(2deg); }
  }

  #chick.squish { animation: squish .45s cubic-bezier(.3,1.5,.5,1); }

  @keyframes squish {
    0%   { transform: scale(1, 1); }
    35%  { transform: scale(1.12, 1.07); }
    65%  { transform: scale(.96, 1.02); }
    100% { transform: scale(1, 1); }
  }

  /* overinflated: idle bob turns into a tense tremble */
  #chick.tight { animation: tremble .16s linear infinite; }

  @keyframes tremble {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25%      { transform: translate(var(--amp), 0) rotate(.6deg); }
    75%      { transform: translate(calc(var(--amp) * -1), 0) rotate(-.6deg); }
  }

  /* leaking air: wobbly flap while it zips around */
  #chick.flying { animation: flutter .1s linear infinite; }

  @keyframes flutter {
    0%, 100% { transform: rotate(-6deg) scale(1.04, .96); }
    50%      { transform: rotate(6deg) scale(.96, 1.04); }
  }

  #eyesOpen, #herEyesOpen { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
  #herEyesOpen { animation-duration: 4.6s; animation-delay: 1.3s; }

  @keyframes blink {
    0%, 94%, 100% { transform: scaleY(1); }
    97%           { transform: scaleY(.1); }
  }

  #eyesHappy, #herEyesHappy { display: none; }
  #chick.happy #eyesOpen, #chick.love #eyesOpen, #herChick.love #herEyesOpen { display: none; }
  #chick.happy #eyesHappy, #chick.love #eyesHappy, #herChick.love #herEyesHappy { display: inline; }

  #beakLow, #herBeakLow { transform-box: fill-box; transform-origin: 50% 0; transition: transform .12s; }
  #chick.happy #beakLow { transform: translateY(3px) scaleY(1.3); }

  .wing { transform-box: fill-box; transition: transform .2s; }
  #wingL, #herWingL { transform-origin: 100% 20%; }
  #wingR, #herWingR { transform-origin: 0% 20%; }
  #chick.happy #wingL, #chick.love #wingL { transform: rotate(35deg); }
  #chick.happy #wingR, #chick.love #wingR { transform: rotate(-35deg); }
  .her-wrap.hugging #herWingL { transform: rotate(75deg); }

  .cheek { opacity: var(--blush-amt, .4); transition: opacity .3s; }
  .her-cheek { opacity: .55; transition: opacity .3s; }
  #herChick.love .her-cheek { opacity: 1; }

  /* she hangs on to his feet when he flies off */
  .her-wrap.dangle #herChick { animation: dangle 1s ease-in-out infinite; transform-origin: 50% 0; }
  .her-wrap.dangle #herWingL { transform: rotate(150deg); }
  .her-wrap.dangle #herWingR { transform: rotate(-150deg); }

  @keyframes dangle {
    0%, 100% { transform: rotate(-12deg); }
    50%      { transform: rotate(12deg); }
  }

  .her-say {
    position: absolute;
    bottom: 100%;
    left: 50%;
    translate: -50% -6px;
    white-space: nowrap;
    padding: 6px 12px;
    background: #fff;
    border-radius: 14px;
    font-size: .95rem;
    font-weight: 600;
    color: var(--rose-deep);
    box-shadow: 0 4px 0 rgba(74, 44, 42, .06), 0 8px 20px rgba(255, 92, 138, .18);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }

  .her-say.show { opacity: 1; animation: pop .35s cubic-bezier(.3,1.6,.5,1); }

  .chick-wrap.charge #chick { animation: shake .08s linear infinite; }
  .chick-wrap.charge { animation: charge 1.3s ease-in forwards; }

  @keyframes shake {
    0%   { transform: translate(-3px, 1px) rotate(-3deg); }
    50%  { transform: translate(3px, -1px) rotate(3deg); }
    100% { transform: translate(-3px, 1px) rotate(-3deg); }
  }

  @keyframes charge {
    0%   { filter: brightness(1); transform: translateX(calc(-50% + var(--hx, 0px))) scale(var(--grow, 1)); }
    70%  { transform: translateX(calc(-50% + var(--hx, 0px))) scale(calc(var(--grow, 1) * 1.12), calc(var(--grow, 1) * 1.08)); }
    100% { filter: brightness(1.2) saturate(1.2); transform: translateX(calc(-50% + var(--hx, 0px))) scale(calc(var(--grow, 1) * 1.22), calc(var(--grow, 1) * 1.16)); }
  }

  .big-heart {
    position: fixed;
    z-index: 55;
    font-size: 76px;
    line-height: 1;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0);
    animation: bigHeart 1.9s cubic-bezier(.3,1.6,.5,1) forwards;
  }

  @keyframes bigHeart {
    0%   { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    20%  { transform: translate(-50%, -50%) scale(1.15); }
    35%  { transform: translate(-50%, -50%) scale(.95); }
    50%  { transform: translate(-50%, -50%) scale(1.1); }
    80%  { transform: translate(-50%, -60%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -90%) scale(.8); opacity: 0; }
  }

  .pop-text {
    position: fixed;
    z-index: 55;
    font-size: 5.5rem;
    font-weight: 700;
    color: #fff;
    -webkit-text-stroke: 3px var(--rose-deep);
    text-shadow: 0 6px 0 var(--rose-deep), 0 0 40px rgba(255, 212, 59, .9);
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: popText .9s cubic-bezier(.3,1.6,.5,1) forwards;
  }

  @keyframes popText {
    0%   { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); opacity: 0; }
    25%  { transform: translate(-50%, -50%) scale(1.25) rotate(6deg); opacity: 1; }
    70%  { transform: translate(-50%, -50%) scale(1) rotate(-4deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.4) rotate(-4deg); opacity: 0; }
  }

  .shock {
    position: fixed;
    z-index: 54;
    width: 40px;
    height: 40px;
    margin: -20px 0 0 -20px;
    border-radius: 50%;
    border: 6px solid #FFD43B;
    pointer-events: none;
    animation: shock .7s ease-out forwards;
  }

  @keyframes shock {
    from { transform: scale(1);  opacity: 1; }
    to   { transform: scale(18); opacity: 0; border-width: 1px; }
  }

  #btn {
    --dx: 0px; --dy: 0px; --rot: 0deg; --press: 0px;
    position: relative;
    z-index: 3;
    font: inherit;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: .02em;
    color: #fff;
    padding: 16px 34px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(180deg, #FF7AA0, var(--rose));
    box-shadow: 0 6px 0 var(--rose-deep), 0 14px 26px rgba(226, 62, 109, .35);
    cursor: pointer;
    touch-action: manipulation;
    transform: translate(var(--dx), calc(var(--dy) + var(--press))) rotate(var(--rot));
    transition: transform .25s cubic-bezier(.3,1.6,.5,1), box-shadow .1s;
  }

  #btn:active { --press: 5px; box-shadow: 0 1px 0 var(--rose-deep), 0 6px 14px rgba(226, 62, 109, .3); }
  #btn:focus-visible { outline: 3px dashed var(--rose-deep); outline-offset: 6px; }
  #btn:disabled { cursor: default; }

  .hint {
    position: absolute;
    bottom: max(18px, env(safe-area-inset-bottom));
    font-size: .85rem;
    color: rgba(74, 44, 42, .45);
    z-index: 2;
  }

  body.revealed #stage {
    transform: scale(.4);
    opacity: 0;
    filter: blur(8px);
    pointer-events: none;
  }

  /* ---------- the flash ---------- */

  #flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, #fff 0, #FFF3C4 50%, #FFD43B 100%);
    opacity: 0;
    pointer-events: none;
    z-index: 50;
  }

  #flash.go { animation: flash 1.1s ease-out; }

  @keyframes flash {
    0%   { opacity: 0; }
    12%  { opacity: .85; }
    100% { opacity: 0; }
  }

  /* ---------- stage 2: the reveal ---------- */

  #reveal {
    position: fixed;
    inset: 0;
    display: flex;
    overflow-y: auto;
    padding: 24px 16px;
    background: linear-gradient(165deg, var(--night-1) 0%, var(--night-2) 55%, var(--night-3) 100%);
    color: #fff;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1s ease .25s, visibility 0s linear 1.25s;
    user-select: text;
    -webkit-user-select: text;
  }

  body.revealed #reveal { opacity: 1; visibility: visible; transition: opacity 1s ease .25s, visibility 0s; }

  .stars { position: fixed; inset: 0; pointer-events: none; }

  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #fff;
    animation: twinkle ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: .15; transform: scale(.6); }
    50%      { opacity: 1;   transform: scale(1.2); }
  }

  .reveal-inner {
    position: relative;
    margin: auto;
    width: 100%;
    max-width: 580px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .big { position: relative; transition: opacity .5s, transform .5s; }

  .heart-badge {
    position: relative;
    width: min(240px, 62vw);
    aspect-ratio: 1;
    margin: 0 auto;
    transform: scale(0);
  }

  body.revealed .heart-badge { animation: heartIn 1.1s cubic-bezier(.3,1.6,.5,1) .6s forwards, beat 1.4s ease-in-out 2s infinite; }

  @keyframes heartIn {
    0%   { transform: scale(0) rotate(-30deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.08); }
    30%      { transform: scale(.98); }
    45%      { transform: scale(1.05); }
  }

  .heart-badge svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 28px rgba(255, 111, 145, .8));
  }

  .heart-badge .num {
    position: absolute;
    inset: 0 0 12% 0;
    display: grid;
    place-items: center;
    font-size: min(130px, 34vw);
    font-weight: 700;
    line-height: 1;
    color: #fff;
    text-shadow: 0 4px 0 rgba(226, 62, 109, .6);
  }

  .big .label {
    margin-top: 10px;
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    font-weight: 600;
    letter-spacing: .02em;
    opacity: 0;
    transform: translateY(14px);
  }

  body.revealed .big .label { animation: fadeUp .8s ease 1.5s forwards; }

  .big .sub {
    margin-top: 4px;
    font-family: var(--font-hand);
    font-size: 1.5rem;
    color: #FFD6E0;
    opacity: 0;
  }

  body.revealed .big .sub { animation: fadeUp .8s ease 2s forwards; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .env-area {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: max-height 1s ease, opacity .8s ease .3s, margin .8s;
  }

  #reveal.stage2 .env-area { max-height: 340px; opacity: 1; margin-top: 34px; overflow: visible; }

  .envelope {
    position: relative;
    width: 260px;
    height: 170px;
    border: none;
    background: none;
    cursor: pointer;
    perspective: 800px;
    animation: hover 2.2s ease-in-out infinite;
    touch-action: manipulation;
  }

  .envelope:focus-visible { outline: 3px dashed #fff; outline-offset: 10px; border-radius: 12px; }

  @keyframes hover {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50%      { transform: translateY(-8px) rotate(1.5deg); }
  }

  .envelope span { position: absolute; display: block; }

  .env-back {
    inset: 0;
    background: #F79AB2;
    border-radius: 12px;
    z-index: 1;
  }

  .env-letter {
    left: 14px; right: 14px; top: 12px; bottom: 12px;
    background: var(--paper);
    border-radius: 8px;
    z-index: 2;
    transition: transform .8s cubic-bezier(.3,1.3,.5,1) .35s;
    background-image: repeating-linear-gradient(transparent 0 18px, rgba(255, 92, 138, .18) 18px 19px);
    background-position: 0 30px;
  }

  .env-front {
    inset: 0;
    background: #FFC2D1;
    border-radius: 12px;
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
    z-index: 3;
    box-shadow: 0 20px 40px rgba(0, 0, 0, .25);
  }

  .env-flap {
    left: 0; right: 0; top: 0;
    height: 62%;
    background: #FF9BB3;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    z-index: 4;
    border-radius: 12px 12px 0 0;
    transition: transform .6s ease, z-index 0s linear .3s;
  }

  .seal {
    left: 50%; top: 62%;
    width: 46px; height: 46px;
    margin: -23px 0 0 -23px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FF7AA0, var(--rose-deep));
    color: #fff;
    font-size: 22px;
    line-height: 46px;
    z-index: 5;
    box-shadow: 0 3px 8px rgba(0, 0, 0, .25);
    transition: transform .3s, opacity .3s;
  }

  .envelope.open { animation: none; }
  .envelope.open .seal { transform: scale(0); opacity: 0; }
  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 0; }
  .envelope.open .env-letter { transform: translateY(-90px); }

  .tap-hint {
    margin-top: 18px;
    font-size: 1.05rem;
    color: #FFE1E8;
    animation: nudge 1.6s ease-in-out infinite;
  }

  @keyframes nudge {
    0%, 100% { opacity: .55; }
    50%      { opacity: 1; }
  }

  #reveal.opening .big,
  #reveal.opening .env-area { opacity: 0; transform: translateY(-30px); transition: opacity .5s ease .9s, transform .5s ease .9s; }

  #reveal.read .big,
  #reveal.read .env-area { display: none; }

  .letter {
    display: none;
    position: relative;
    width: 100%;
    margin-top: 70px;
    padding: 40px 28px 34px;
    background: var(--paper);
    color: var(--ink);
    border-radius: 22px;
    text-align: left;
    box-shadow: 0 30px 80px rgba(20, 0, 40, .45);
  }

  #reveal.read .letter { display: block; animation: letterIn .9s cubic-bezier(.3,1.3,.5,1); }

  @keyframes letterIn {
    from { opacity: 0; transform: translateY(60px) scale(.9) rotate(-2deg); }
    to   { opacity: 1; transform: none; }
  }

  .letter .mini-duo {
    position: absolute;
    top: -78px;
    right: 16px;
    display: flex;
    align-items: flex-end;
    animation: peek 2.4s ease-in-out infinite;
  }

  .mini-duo svg { overflow: visible; display: block; }
  .mini-duo .mini-him { width: 96px; height: 96px; }
  .mini-duo .mini-her { width: 72px; height: 72px; margin-left: -24px; }

  .mini-duo .mini-love {
    position: absolute;
    top: -6px;
    left: 58%;
    font-size: 22px;
    animation: beat 1.4s ease-in-out infinite;
  }

  @keyframes peek {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-6px) rotate(3deg); }
  }

  .letter .date {
    font-size: .85rem;
    font-weight: 600;
    letter-spacing: .25em;
    color: var(--rose);
  }

  .letter h1 {
    margin-top: 6px;
    font-size: clamp(1.7rem, 6.5vw, 2.3rem);
    font-weight: 700;
    line-height: 1.15;
    text-wrap: balance;
  }

  .letter h1 .her { color: var(--rose); }

  .message {
    margin-top: 18px;
    font-family: "Noto Sans Georgian", var(--font-ui);
    font-size: 1.2rem;
    font-weight: 500;
    line-height: 38px;
    background-image: repeating-linear-gradient(transparent 0 36px, rgba(255, 92, 138, .16) 36px 37px, transparent 37px 38px);
  }

  .message p { opacity: 0; animation: fadeUp .8s ease forwards; }
  .message p + p { margin-top: 38px; }

  .letter .sign {
    margin-top: 26px;
    text-align: right;
    font-family: var(--font-hand);
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--rose-deep);
    opacity: 0;
    animation: fadeUp .8s ease forwards;
  }

  .replay {
    display: none;
    margin: 22px auto 8px;
    font: inherit;
    font-size: .95rem;
    color: #FFE1E8;
    background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 255, 255, .25);
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
  }

  #reveal.read .replay { display: block; }

  #fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 60;
  }

  @media (min-width: 700px) {
    :root { --him: 240px; --her: 165px; }
    .letter { padding: 48px 48px 40px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #chick, #herChick, .floaty, .envelope, .letter .mini-duo, .heart-badge { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<main id="stage">

  function buttonText(n) {
    if (n < 12) return "don't click me";
    if (n < 26) return "i said DON'T";
    if (n < 38) return "stop inflating me!";
    if (n < 47) return "ok… click me 👀";
    return "don't you dare";
  }

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), speech = $("speech"), btn = $("btn"), chickWrap = $("chickWrap");
  const chick = $("chick"), pupils = $("pupils"), hint = $("hint");
  const herWrap = $("herWrap"), herChick = $("herChick"), herPupils = $("herPupils"), herSay = $("herSay");
  const reveal = $("reveal"), envelope = $("envelope"), flash = $("flash");

  let clicks = 0;
  let done = false;
  let grow = 1;

  // ---------- particles ----------
  const canvas = $("fx");
  const ctx = canvas.getContext("2d");
  let particles = [];
  let running = false;
  let rainTimer = null;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  const CONFETTI = ["#FFD43B", "#FF5C8A", "#FFB5C5", "#FFFFFF", "#FF9F1C", "#B794F6", "#7FD8FF"];
  const FLUFF = ["#FFD43B", "#FFE58A", "#F5C518", "#FFF2A8"];
  const HEARTS = ["#FF5C8A", "#FF8FAB", "#FFB5C5"];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const angleDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

  function spawn(p) {
    particles.push(Object.assign({ rot: rand(0, Math.PI * 2), vr: rand(-.2, .2), life: 0, drag: .985, g: .25, flip: rand(0, Math.PI * 2) }, p));
    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  function drawHeart(s) {
    ctx.beginPath();
    ctx.moveTo(0, -s * .2);
    ctx.bezierCurveTo(0, -s * .5, -s * .5, -s * .5, -s * .5, -s * .2);
    ctx.bezierCurveTo(-s * .5, s * .1, 0, s * .3, 0, s * .5);
    ctx.bezierCurveTo(0, s * .3, s * .5, s * .1, s * .5, -s * .2);
    ctx.bezierCurveTo(s * .5, -s * .5, 0, -s * .5, 0, -s * .2);
    ctx.fill();
  }

  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    particles = particles.filter((p) => p.life < p.max && p.y < innerHeight + 60);
    for (const p of particles) {
      p.life++;
      p.vx *= p.drag; p.vy *= p.drag;
      p.vy += p.g;
      if (p.sway) p.vx += Math.sin(p.life / 20 + p.flip) * p.sway;
      p.x += p.vx; p.y += p.vy;
      p.rot += p.vr;
      const fade = Math.min(1, (p.max - p.life) / 30);
      ctx.save();
      ctx.globalAlpha = fade * (p.alpha ?? 1);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === "heart") {
        drawHeart(p.size);
      } else if (p.shape === "feather") {
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size * .3, p.size * .6, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.shape === "dot" || p.shape === "puff") {
        const r = p.size / 2 * (p.shape === "puff" ? 1 + p.life / p.max * 1.5 : 1);
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.shape === "text") {
        ctx.font = `${p.size}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(p.text, 0, 0);
      } else {
        ctx.scale(1, Math.cos(p.life / 6 + p.flip));
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      }
      ctx.restore();
    }
    if (particles.length) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  function pokeBurst(x, y) {
    for (let i = 0; i < 9; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(2, 6);
      const heart = Math.random() < .5;
      spawn({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3,
        size: heart ? rand(10, 16) : rand(8, 12),
        color: heart ? pick(["#FF5C8A", "#FFB5C5"]) : pick(FLUFF),
        shape: heart ? "heart" : "feather",
        g: .18, max: 60, vr: rand(-.1, .1)
      });
    }
  }

  function confetti(x, y, n, power = 14) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(power * .3, power);
      const heart = Math.random() < .3;
      spawn({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - power * .35,
        size: heart ? rand(12, 22) : rand(8, 14),
        color: heart ? pick(["#FF5C8A", "#FF8FAB", "#FFB5C5"]) : pick(CONFETTI),
        shape: heart ? "heart" : "rect",
        g: .22, drag: .975, max: rand(140, 220), sway: .03
      });
    }
  }

  // little hearts floating up from a spot
  function heartsAt(x, y, n) {
    for (let i = 0; i < n; i++) {
      spawn({
        x: x + rand(-12, 12), y: y + rand(-6, 6), vx: rand(-1.6, 1.6), vy: rand(-3.4, -1.4),

        g: -.01, drag: .985, max: rand(60, 90), rot: rand(-.3, .3), vr: rand(-.03, .03)

    }
  }

  function emojiAt(x, y, text, size = 26, vy = -.6) {

      const a = rand(0, Math.PI * 2), sp = rand(4, 14);

    const add = (tag, attrs) => {
      const el = document.createElementNS(NS, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      hair.appendChild(el);
    };
    const swirl = (cx, cy, r) => {
      let d = "";
      for (let i = 0; i <= 24; i++) {
        const th = -Math.PI * .2 + (i / 24) * Math.PI * 2.4;
        const rr = r * (.62 - (i / 24) * .45);
        d += (i ? "L" : "M") + (cx + Math.cos(th) * rr).toFixed(1) + " " + (cy + Math.sin(th) * rr).toFixed(1);
      }
      return d;
    };
    const curl = (cx, cy, r) => {
      add("circle", { cx, cy, r, fill: "url(#curlGrad)" });
      add("path", { d: swirl(cx + r * .05, cy + r * .05, r), fill: "none", stroke: "#3B2213", "stroke-width": (r * .15).toFixed(1), "stroke-linecap": "round", "stroke-linejoin": "round" });
      add("path", { d: `M${cx - r * .62} ${cy - r * .18} A${r * .66} ${r * .66} 0 0 1 ${cx - r * .12} ${cy - r * .64}`, fill: "none", stroke: "#D9A77A", "stroke-width": (r * .13).toFixed(1), "stroke-linecap": "round", opacity: ".8" });
    };

    add("path", { d: "M50 80 C46 50 70 32 100 32 C130 32 154 50 150 80 C142 72 128 70 116 74 C108 66 92 66 84 74 C72 70 58 72 50 80 Z", fill: "#4A2B19" });
    add("path", { d: "M98 26 C96 12 110 4 116 12 C122 20 110 26 107 19 C104 13 112 10 114 15", fill: "none", stroke: "#6B4127", "stroke-width": 4.5, "stroke-linecap": "round", "stroke-linejoin": "round" });
    for (const [x, y, r] of [
      [54, 70, 11], [60, 54, 12.5], [74, 42, 13.5], [92, 35, 14], [110, 34, 14], [127, 40, 13.5], [141, 52, 12.5], [147, 68, 11],
      [82, 54, 11.5], [101, 50, 12], [120, 54, 11.5],
      [66, 72, 9.5], [84, 69, 10], [102, 67, 10], [120, 69, 10], [136, 72, 9.5]
    ]) curl(x, y, r);
  })();

  for (let i = 0; i < 14; i++) {
    const h = document.createElement("span");
    h.className = "floaty";
    h.textContent = pick(["♥", "♡", "✿"]);
    h.style.left = rand(0, 100) + "%";
    h.style.fontSize = rand(12, 28) + "px";
    h.style.animationDuration = rand(10, 20) + "s";
    h.style.animationDelay = -rand(0, 20) + "s";
    stage.appendChild(h);
  }

  function say(text) {
    speech.textContent = text;
    speech.classList.remove("pop");
    void speech.offsetWidth;
    speech.classList.add("pop");
  }

  let herSayTimer;
  function herSays(text, ms = 1800) {
    herSay.textContent = text;
    herSay.classList.remove("show");
    void herSay.offsetWidth;
    herSay.classList.add("show");
    clearTimeout(herSayTimer);
    herSayTimer = setTimeout(() => herSay.classList.remove("show"), ms);
  }

  let happyTimer;
  function react() {
    chick.classList.remove("squish", "tight");
    void chick.getBoundingClientRect();
    chick.classList.add("squish", "happy");
    clearTimeout(happyTimer);
    happyTimer = setTimeout(() => {
      chick.classList.remove("happy", "squish");
      if (clicks > TOTAL * .55) chick.classList.add("tight");
    }, 450);
  }

  // How big he may get before he would leave the screen.
  function maxGrow() {
    const r = chickWrap.getBoundingClientRect();
    const base = chickWrap.offsetWidth;
    return Math.max(1.3, Math.min(2.4, (innerWidth * 1.05) / base, (r.bottom - 8) / base));
  }

  // Side by side while there's room; once he's too big she stands in front of his round belly.
  function layout() {
    const base = chickWrap.offsetWidth, herW = herWrap.offsetWidth, gap = 4;
    const hisW = base * grow, half = innerWidth / 2;
    const hx = Math.min(0, Math.max(-(gap + herW) / 2, hisW / 2 + 6 - half));
    const sx = Math.min(hx + hisW / 2 + gap + herW / 2, half - herW / 2 - 6);
    stage.style.setProperty("--hx", hx + "px");
    stage.style.setProperty("--sx", sx + "px");
    const lift = Math.min((grow - 1) * chickWrap.offsetHeight * .6, speech.offsetTop - 12);
    speech.style.translate = `${hx}px ${-Math.max(0, lift)}px`;
  }

  // t goes 0 → 1: the body swells, the curls stretch with it, wings and feet get pushed out, a balloon shine appears.
  function shapeInflate(t) {
    const set = (id, attrs) => { const el = $(id); for (const k in attrs) el.setAttribute(k, attrs[k]); };
    set("bodyShape", { rx: 64 + 20 * t, ry: 64 + 15 * t, cy: 114 - 3 * t });
    set("belly", { rx: 36 + 14 * t, ry: 24 + 8 * t, cy: 146 + 4 * t });
    set("shine", { opacity: Math.max(0, (t - .25) * .9), rx: 9 + 6 * t, ry: 5 + 3 * t, cx: 50 - 10 * t, transform: `rotate(-60 ${50 - 10 * t} 100)` });
    set("wingGL", { transform: `translate(${-20 * t} ${-6 * t}) rotate(${18 + 40 * t} 40 122)` });
    set("wingGR", { transform: `translate(${20 * t} ${-6 * t}) rotate(${-18 - 40 * t} 160 122)` });
    set("feet", { transform: `translate(0 ${10 * t})` });
    set("hair", { transform: `translate(0 ${-3 * t}) translate(100 114) scale(${1 + .31 * t} ${1 + .23 * t}) translate(-100 -114)` });
    set("bowtie", { transform: `translate(0 ${12 * t})` });
    set("shadow", { rx: 52 + 26 * t, cy: 190 + 8 * t });
    chickWrap.querySelectorAll(".cheek").forEach((c, i) => {
      c.setAttribute("rx", 11 + 6 * t);
      c.setAttribute("ry", 7 + 3 * t);
      c.setAttribute("cx", i ? 136 + 10 * t : 64 - 10 * t);
    });
  }

  function inflate(t) {
    shapeInflate(t);
    grow = 1 + (maxGrow() - 1) * t;
    chickWrap.style.setProperty("--grow", grow);
    chick.style.setProperty("--amp", (t * 2).toFixed(2) + "px");
    layout();
  }

  // ---------- the two of them: little surprises while she clicks ----------
  const setLove = (on) => { chick.classList.toggle("love", on); herChick.classList.toggle("love", on); };
  const box = () => ({ me: chickWrap.getBoundingClientRect(), her: herWrap.getBoundingClientRect() });
  // a point on a chick, in its own 200×200 drawing units
  const at = (r, x, y) => ({ x: r.left + r.width * x / 200, y: r.top + r.height * y / 200 });

  // she hops over by (dx, dy), stays a moment, and hops back; arrives at ~32% of the way
  function herHop(dx, dy, ms) {
    return herWrap.animate([
      { translate: "0px 0px" },
      { translate: `${dx * .5}px ${Math.min(dy, 0) * .6 - 28}px`, offset: .18 },
      { translate: `${dx}px ${dy}px`, offset: .32 },
      { translate: `${dx}px ${dy}px`, offset: .78 },
      { translate: "0px 0px" }
    ], { duration: ms, easing: "ease-in-out" });
  }

  // he leans toward her (or away, with a negative angle)
  function lean(deg, ms) {
    return chickWrap.animate([
      { rotate: "0deg" }, { rotate: `${deg}deg`, offset: .32 }, { rotate: `${deg}deg`, offset: .78 }, { rotate: "0deg" }
    ], { duration: ms, easing: "ease-in-out" });
  }

  // something flies from one spot to another in an arc
  function toss(from, to, opts, frames = 45) {
    const g = .2;
    spawn(Object.assign({
      x: from.x, y: from.y, vx: (to.x - from.x) / frames, vy: (to.y - from.y) / frames - g * frames / 2,
      g, drag: 1, max: frames, rot: 0, vr: 0
    }, opts));
    return frames * 16.7;
  }

  const MOMENTS = {
    4: { line: "hi cutie 👋", run() {
      $("herWingL").animate([
        { transform: "rotate(0deg)" }, { transform: "rotate(110deg)" }, { transform: "rotate(70deg)" },
        { transform: "rotate(110deg)" }, { transform: "rotate(70deg)" }, { transform: "rotate(0deg)" }
      ], { duration: 1300, easing: "ease-in-out" });
      const { her } = box();
      setTimeout(() => heartsAt(her.left + her.width * .2, her.top + her.height * .3, 4), 400);
      return 1400;
    } },

    7: { line: "come here 🤗", run: hug },
    27: { line: "my squishy boy 🥰", run: hug },

    11: { line: "mwah 💋", run: () => kiss(false) },
    31: { line: "MWAH 💋💋", run: () => kiss(true) },

    15: { line: "catch! 😘", run() {
      const { me, her } = box();
      herWrap.animate([{ rotate: "0deg" }, { rotate: "-10deg", offset: .4 }, { rotate: "0deg" }], { duration: 700 });
      herChick.classList.add("love");
      setTimeout(() => {
        const to = at(me, 136, 118);
        const flight = toss(at(her, 90, 124), to, { size: 24, color: "#FF5C8A", shape: "heart" });
        setTimeout(() => { heartsAt(to.x, to.y, 10); setLove(true); }, flight);
      }, 350);
      setTimeout(() => setLove(false), 2100);
      return 2200;
    } },

    19: { line: "boop!", run() {
      const { me, her } = box();
      const hisBeak = at(me, 106, 122), herBeak = at(her, 94, 124);
      herHop(hisBeak.x - herBeak.x + 4, hisBeak.y - herBeak.y, 1500);
      lean(5, 1500);
      setTimeout(() => { confetti(hisBeak.x, hisBeak.y, 16, 5); setLove(true); }, 500);
      setTimeout(() => setLove(false), 1200);
      return 1600;
    } },

    23: { line: "dance with me 💃", run() {
      setLove(true);
      for (let i = 0; i < 4; i++) {
        setTimeout(() => {
          const side = i % 2 ? 1 : -1;
          herWrap.animate([{ translate: "0 0", rotate: "0deg" }, { translate: "0 -26px", rotate: `${10 * side}deg` }, { translate: "0 0", rotate: "0deg" }], { duration: 380, easing: "ease-out" });
          chickWrap.animate([{ rotate: "0deg" }, { rotate: `${-5 * side}deg` }, { rotate: "0deg" }], { duration: 380, easing: "ease-out" });
          const { me, her } = box();
          emojiAt(rand(me.left, her.right), Math.min(me.top, her.top) + 10, pick(["♪", "♫", "🎶"]), 24, -1.4);
        }, i * 400);
      }
      setTimeout(() => setLove(false), 1700);
      return 1800;
    } },

    35: { line: "for me?? 🥺", sayAt: 800, run() {
      const { me, her } = box();
      const to = at(her, 100, 60);
      const flight = toss(at(me, 165, 118), to, { size: 34, shape: "text", text: "🌹", vr: .08 }, 48);
      setTimeout(() => { heartsAt(to.x, to.y, 8); herChick.classList.add("love"); }, flight);
      setTimeout(() => herChick.classList.remove("love"), 2200);
      return 2300;
    } },

    39: { line: "there there 🫶", run() {
      const { me, her } = box();
      const belly = at(me, 150, 150);
      herHop(Math.min(0, belly.x - (her.left + her.width * .3)), 0, 2200);
      setTimeout(() => {
        herChick.classList.add("love");
        chick.classList.add("love");
        $("herWingL").animate([{ transform: "rotate(40deg)" }, { transform: "rotate(85deg)" }], { duration: 200, iterations: 6, direction: "alternate" });
      }, 650);
      setTimeout(() => setLove(false), 1900);
      return 2300;
    } },

    43: { line: "🫶", run() {
      const { me, her } = box();
      lean(6, 2000);
      herWrap.animate([{ rotate: "0deg" }, { rotate: "-8deg", offset: .32 }, { rotate: "-8deg", offset: .78 }, { rotate: "0deg" }], { duration: 2000, easing: "ease-in-out" });
      setTimeout(() => {
        setLove(true);
        const heart = document.createElement("div");
        heart.className = "big-heart";
        heart.textContent = "💗";
        heart.style.left = (at(me, 170, 0).x + at(her, 30, 0).x) / 2 + "px";
        heart.style.top = Math.min(at(me, 0, 60).y, her.top) - 20 + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 2000);
      }, 500);
      setTimeout(() => setLove(false), 1900);
      return 2100;
    } },

    47: { line: "babe you're gonna pop!! 😰", run() {
      herWrap.animate([
        { rotate: "0deg" }, { rotate: "-9deg" }, { rotate: "9deg" }, { rotate: "-9deg" }, { rotate: "9deg" }, { rotate: "0deg" }
      ], { duration: 900 });
      const { her } = box();
      emojiAt(her.right - 10, her.top + 16, "💦", 22, -.3);
      return 1100;
    } }
  };

  function hug() {
    const { me, her } = box();
    const flank = at(me, 160, 0).x;
    const ms = 2100;
    herHop(Math.min(0, flank - (her.left + her.width * .32)), 0, ms);
    lean(6, ms);
    setTimeout(() => {
      setLove(true);
      herWrap.classList.add("hugging");
      const { me: m, her: h } = box();
      heartsAt((m.right + h.left) / 2, Math.min(m.top + m.height * .3, h.top), 8);
    }, 650);
    setTimeout(() => { setLove(false); herWrap.classList.remove("hugging"); }, 1650);
    return ms;
  }

  function kiss(big) {
    const { me, her } = box();
    const cheek = at(me, 138, 120), beak = at(her, 100, 126);
    const ms = 1900;
    herHop(cheek.x - beak.x + 6, cheek.y - beak.y, ms);
    lean(6, ms);
    setTimeout(() => {
      setLove(true);
      chickWrap.style.setProperty("--blush-amt", 1);
      emojiAt(cheek.x, cheek.y - 4, "💋", big ? 34 : 24, -.3);
      heartsAt(cheek.x, cheek.y - 14, big ? 18 : 8);
      if (big) confetti(cheek.x, cheek.y, 30, 7);
    }, 600);
    setTimeout(() => setLove(false), 1600);
    return ms;
  }

  // moments queue up so none is skipped when she clicks fast
  const queue = [];
  let busy = false;
  function moment(n) {
    if (MOMENTS[n]) queue.push(MOMENTS[n]);
    if (busy || done || !queue.length) return;
    const m = queue.shift();
    busy = true;
    setTimeout(() => !done && herSays(m.line), m.sayAt || 0);
    const ms = m.run();
    setTimeout(() => { busy = false; moment(); }, ms + 80);
  }

  function poke(e) {
    if (done) return;
    clicks++;

    let x = e.clientX, y = e.clientY;
    if (!x && !y) {
      const r = chickWrap.getBoundingClientRect();
      x = r.left + r.width / 2; y = r.top + r.height / 2;
    }
    pokeBurst(x, y);
    react();

    hint.style.opacity = 0;

    inflate(Math.min(1, clicks / (TOTAL - 1)));
    chickWrap.style.setProperty("--blush-amt", Math.min(1, .4 + clicks * .013));

    btn.textContent = buttonText(clicks);
    const wild = Math.min(1, clicks / 30);
    btn.style.setProperty("--dx", rand(-14, 14) * wild + "px");
    btn.style.setProperty("--dy", rand(-6, 6) * wild + "px");
    btn.style.setProperty("--rot", rand(-6, 6) * wild + "deg");

    if (navigator.vibrate) navigator.vibrate(12);

    if (clicks >= TOTAL) finale();
    else {
      say(LINES[clicks - 1]);
      moment(clicks);
    }
  }

  btn.addEventListener("click", poke);
  chickWrap.addEventListener("click", poke);
  herWrap.addEventListener("click", poke);

  addEventListener("pointermove", (e) => {
    if (done) return;
    for (const [wrap, eyes] of [[chickWrap, pupils], [herWrap, herPupils]]) {
      const r = wrap.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height * .5);
      const d = Math.hypot(dx, dy) || 1;
      const m = Math.min(1.6, d / 60);
      eyes.setAttribute("transform", `translate(${(dx / d) * m} ${(dy / d) * m})`);
    }
  });

  addEventListener("resize", () => { if (!done) layout(); });
  layout();

  // ---------- the big moment ----------
  function finale() {
    done = true;
    queue.length = 0;
    btn.disabled = true;
    btn.textContent = "uh oh…";
    say("i'm gonna… i'm gonna… 😱");
    clearTimeout(happyTimer);
    chick.classList.remove("squish", "tight", "love");
    chick.classList.add("happy");
    chickWrap.getAnimations().forEach((a) => a.cancel());
    chickWrap.classList.add("charge");

    // she runs under him to catch him
    herWrap.getAnimations().forEach((a) => a.cancel());
    herChick.classList.remove("love");
    herSays("babe?? 😳", 1300);
    const { me, her } = box();
    herWrap.animate([
      { translate: "0px 0px" },
      { translate: `${(me.left + me.width / 2) - (her.left + her.width / 2) + me.width * .1}px -6px` }
    ], { duration: 900, easing: "ease-in-out", fill: "forwards" });

    setTimeout(() => {
      const r = chickWrap.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height * .55;
      speech.style.visibility = "hidden";
      btn.textContent = "noooo!";
      flash.classList.add("go");

      const word = document.createElement("div");
      word.className = "pop-text";
      word.textContent = "POP!";
      const ring = document.createElement("div");
      ring.className = "shock";
      for (const el of [word, ring]) {
        el.style.left = cx + "px";
        el.style.top = cy + "px";
        document.body.appendChild(el);
      }
      setTimeout(() => { word.remove(); ring.remove(); }, 1200);

      featherBurst(cx, cy, r.width);
      confetti(cx, cy, 110, 16);
      if (navigator.vibrate) navigator.vibrate([60, 30, 120]);

      flyAway(r, () => {
        confetti(innerWidth * .15, innerHeight * .9, 60, 16);
        confetti(innerWidth * .85, innerHeight * .9, 60, 16);
        document.body.classList.add("revealed");
        setTimeout(() => reveal.classList.add("stage2"), 3200);
      });
    }, 1300);
  }

  // Deflate like a let-go balloon with her hanging on to his feet: zip around leaking air, shrink, then float up and away.
  function flyAway(r, onGone) {
    const W = chickWrap.offsetWidth;
    let x = r.left + r.width / 2, y = r.top + r.height / 2;
    let vx = 0, vy = 0, heading = -Math.PI / 2 + rand(-.8, .8), turn = 0, rot = 0;
    const s0 = r.width / W, sEnd = .45, AIR = 2.6;
    const place = (s) => { chickWrap.style.transform = `translate(${x - W / 2}px, ${y - W / 2}px) rotate(${rot}rad) scale(${s})`; };
    // she keeps her own size while he shrinks around her
    const holdOn = (s) => { herWrap.style.scale = (Math.max(.55, Math.min(1, s * .9)) / s).toFixed(3); };

    chickWrap.classList.remove("charge");
    chick.classList.add("flying");
    $("shadow").style.display = "none";
    Object.assign(chickWrap.style, { position: "fixed", left: "0", top: "0", margin: "0", zIndex: 56, transition: "none", transformOrigin: "50% 50%" });
    place(s0);
    document.body.appendChild(chickWrap);

    herWrap.getAnimations().forEach((a) => a.cancel());
    herSay.classList.remove("show");
    Object.assign(herWrap.style, { left: "50%", top: "86%", bottom: "auto", transform: "translateX(-50%)", transition: "none", transformOrigin: "50% 0" });
    herWrap.classList.add("dangle");
    herChick.classList.add("love");
    holdOn(s0);
    chickWrap.appendChild(herWrap);

    const t0 = performance.now();
    let frames = 0;
    function step(now) {
      const air = Math.max(0, 1 - (now - t0) / 1000 / AIR);
      const s = sEnd + (s0 - sEnd) * Math.pow(air, .6);
      const half = W * s / 2;

      if (air > 0) {
        turn = (turn + rand(-.12, .12)) * .9;
        heading += turn;
        // bounce back toward the middle instead of leaving the screen early
        if (x < half || x > innerWidth - half || y < half || y > innerHeight - half) {
          heading += angleDiff(Math.atan2(innerHeight / 2 - y, innerWidth / 2 - x), heading) * .2;
        }
        const thrust = .5 + 1.5 * air;
        vx += Math.cos(heading) * thrust;
        vy += Math.sin(heading) * thrust;
        if (Math.random() < .85) puff(x - Math.cos(heading) * half * .9, y - Math.sin(heading) * half * .9, heading);
      } else {
        // out of air: drift up and away together
        vy -= .8;
        vx += Math.sin(now / 150) * .3;
      }
      vx *= .9; vy *= .9;
      x += vx; y += vy;
      rot += angleDiff((air > 0 ? heading : -Math.PI / 2) + Math.PI / 2, rot) * .25;

      place(s);
      holdOn(s);
      if (++frames % 2 === 0) shapeInflate(air);

      if (y < -W * s - 200) {
        chickWrap.style.visibility = "hidden";
        onGone();
        return;
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // stars
  const stars = $("stars");
  for (let i = 0; i < 70; i++) {
    const s = document.createElement("span");
    s.className = "star";
    s.style.left = rand(0, 100) + "%";
    s.style.top = rand(0, 100) + "%";
    const size = rand(1.5, 3.5);
    s.style.width = s.style.height = size + "px";
    s.style.animationDuration = rand(2, 5) + "s";
    s.style.animationDelay = -rand(0, 5) + "s";
    stars.appendChild(s);
  }

  // the letter, with the two of them peeking over it
  $("herName").textContent = HER_NAME;
  $("sign").textContent = SIGNATURE;
  for (const [src, cls] of [[chickWrap, "mini-him"], [herWrap, "mini-her"]]) {
    const svg = src.querySelector("svg").cloneNode(true);
    svg.querySelectorAll("[id]").forEach((el) => el.removeAttribute("id"));
    svg.classList.add(cls);
    $("miniDuo").appendChild(svg);
  }

  envelope.addEventListener("click", () => {
    if (!reveal.classList.contains("stage2") || envelope.classList.contains("open")) return;
    envelope.classList.add("open");
    reveal.classList.add("opening");
    const r = envelope.getBoundingClientRect();
    setTimeout(() => confetti(r.left + r.width / 2, r.top + r.height / 3, 120, 13), 600);

    setTimeout(() => {
      const box = $("message");
      box.innerHTML = "";
      MESSAGE.forEach((line, i) => {
        const p = document.createElement("p");
        p.textContent = line;
        p.style.animationDelay = (0.7 + i * 0.9) + "s";
        box.appendChild(p);
      });
      $("sign").style.animationDelay = (0.7 + MESSAGE.length * 0.9 + .3) + "s";
      reveal.classList.add("read");
      reveal.scrollTop = 0;
      rainHearts();
    }, 1450);
  });

  $("replay").addEventListener("click", () => location.reload());
</script>
</body>
