<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>don't click me 🐣</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF6EC;
    --blush: #FFE1E8;
    --pink: #FFB5C5;
    --rose: #FF5C8A;
    --rose-deep: #E23E6D;
    --yellow: #FFD43B;
    --orange: #FF9F1C;
    --ink: #4A2C2A;
    --paper: #FFFBF5;
    --night-1: #2B1055;
    --night-2: #7A2A6B;
    --night-3: #FF6F91;
    --font-ui: "Fredoka", "Noto Sans Georgian", ui-rounded, system-ui, sans-serif;
    --font-hand: "Caveat", "Noto Sans Georgian", cursive;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--cream);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- stage 1: the chick ---------- */

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px 16px;
    background:
      radial-gradient(circle at 15% 20%, #FFE7A8 0, transparent 38%),
      radial-gradient(circle at 85% 80%, var(--blush) 0, transparent 45%),
      radial-gradient(circle at 80% 10%, #FFEFD9 0, transparent 35%),
      var(--cream);
    transition: transform .9s cubic-bezier(.6,-0.3,.7,1), opacity .7s ease .2s, filter .7s;
  }

  #stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 92, 138, .14) 1.5px, transparent 1.6px);
    background-size: 26px 26px;
    pointer-events: none;
  }

  .floaty {
    position: absolute;
    bottom: -40px;
    color: var(--pink);
    opacity: .55;
    pointer-events: none;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .55; }
    100% { transform: translateY(-110vh) rotate(40deg); opacity: 0; }
  }

  .speech {
    position: relative;
    z-index: 3;
    max-width: min(320px, 90vw);
    min-height: 1em;
    padding: 12px 18px;
    background: #fff;
    border-radius: 20px;
    font-size: 1.15rem;
    font-weight: 500;
    text-align: center;
    box-shadow: 0 6px 0 rgba(74, 44, 42, .08), 0 12px 30px rgba(255, 92, 138, .15);
    transition: translate .45s cubic-bezier(.3,1.6,.5,1);
  }

  .speech::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -10px;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 0 0 6px 0;
    transform: translateX(-50%) rotate(45deg);
  }

  .speech.pop { animation: pop .35s cubic-bezier(.3,1.6,.5,1); }

  @keyframes pop {
    0%   { transform: scale(.6); opacity: 0; }
    100% { transform: scale(1);  opacity: 1; }
  }

  .chick-wrap {
    position: relative;
    z-index: 1;
    width: 210px;
    height: 210px;
    cursor: pointer;
    transform: scale(var(--grow, 1));
    transform-origin: 50% 100%;
    transition: transform .45s cubic-bezier(.3,1.6,.5,1);
  }

  .chick-wrap svg { width: 100%; height: 100%; overflow: visible; display: block; }

  #chick { animation: idle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 95%; }

  @keyframes idle {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-6px) rotate(2deg); }
  }

  #chick.squish { animation: squish .45s cubic-bezier(.3,1.5,.5,1); }

  @keyframes squish {
    0%   { transform: scale(1, 1); }
    35%  { transform: scale(1.12, 1.07); }
    65%  { transform: scale(.96, 1.02); }
    100% { transform: scale(1, 1); }
  }

  /* overinflated: idle bob turns into a tense tremble */
  #chick.tight { animation: tremble .16s linear infinite; }

  @keyframes tremble {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25%      { transform: translate(var(--amp), 0) rotate(.6deg); }
    75%      { transform: translate(calc(var(--amp) * -1), 0) rotate(-.6deg); }
  }

  /* leaking air: wobbly flap while it zips around */
  #chick.flying { animation: flutter .1s linear infinite; }

  @keyframes flutter {
    0%, 100% { transform: rotate(-6deg) scale(1.04, .96); }
    50%      { transform: rotate(6deg) scale(.96, 1.04); }
  }

  #eyesOpen { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }

  @keyframes blink {
    0%, 94%, 100% { transform: scaleY(1); }
    97%           { transform: scaleY(.1); }
  }

  #eyesHappy { display: none; }
  #chick.happy #eyesOpen { display: none; }
  #chick.happy #eyesHappy { display: inline; }

  #beakLow { transform-box: fill-box; transform-origin: 50% 0; transition: transform .12s; }
  #chick.happy #beakLow { transform: translateY(3px) scaleY(1.3); }

  .wing { transform-box: fill-box; transition: transform .15s; }
  #wingL { transform-origin: 100% 20%; }
  #wingR { transform-origin: 0% 20%; }
  #chick.happy #wingL { transform: rotate(35deg); }
  #chick.happy #wingR { transform: rotate(-35deg); }

  .cheek { opacity: var(--blush-amt, .4); transition: opacity .3s; }

  .chick-wrap.charge #chick { animation: shake .08s linear infinite; }
  .chick-wrap.charge { animation: charge 1.3s ease-in forwards; }

  @keyframes shake {
    0%   { transform: translate(-3px, 1px) rotate(-3deg); }
    50%  { transform: translate(3px, -1px) rotate(3deg); }
    100% { transform: translate(-3px, 1px) rotate(-3deg); }
  }

  @keyframes charge {
    0%   { filter: brightness(1); transform: scale(var(--grow, 1)); }
    70%  { transform: scale(calc(var(--grow, 1) * 1.12), calc(var(--grow, 1) * 1.08)); }
    100% { filter: brightness(1.2) saturate(1.2); transform: scale(calc(var(--grow, 1) * 1.22), calc(var(--grow, 1) * 1.16)); }
  }

  .pop-text {
    position: fixed;
    z-index: 55;
    font-size: 5.5rem;
    font-weight: 700;
    color: #fff;
    -webkit-text-stroke: 3px var(--rose-deep);
    text-shadow: 0 6px 0 var(--rose-deep), 0 0 40px rgba(255, 212, 59, .9);
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: popText .9s cubic-bezier(.3,1.6,.5,1) forwards;
  }

  @keyframes popText {
    0%   { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); opacity: 0; }
    25%  { transform: translate(-50%, -50%) scale(1.25) rotate(6deg); opacity: 1; }
    70%  { transform: translate(-50%, -50%) scale(1) rotate(-4deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.4) rotate(-4deg); opacity: 0; }
  }

  .shock {
    position: fixed;
    z-index: 54;
    width: 40px;
    height: 40px;
    margin: -20px 0 0 -20px;
    border-radius: 50%;
    border: 6px solid #FFD43B;
    pointer-events: none;
    animation: shock .7s ease-out forwards;
  }

  @keyframes shock {
    from { transform: scale(1);  opacity: 1; }
    to   { transform: scale(18); opacity: 0; border-width: 1px; }
  }

  #btn {
    --dx: 0px; --dy: 0px; --rot: 0deg; --press: 0px;
    position: relative;
    z-index: 2;
    font: inherit;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: .02em;
    color: #fff;
    padding: 16px 34px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(180deg, #FF7AA0, var(--rose));
    box-shadow: 0 6px 0 var(--rose-deep), 0 14px 26px rgba(226, 62, 109, .35);
    cursor: pointer;
    touch-action: manipulation;
    transform: translate(var(--dx), calc(var(--dy) + var(--press))) rotate(var(--rot));
    transition: transform .25s cubic-bezier(.3,1.6,.5,1), box-shadow .1s;
  }

  #btn:active { --press: 5px; box-shadow: 0 1px 0 var(--rose-deep), 0 6px 14px rgba(226, 62, 109, .3); }
  #btn:focus-visible { outline: 3px dashed var(--rose-deep); outline-offset: 6px; }
  #btn:disabled { cursor: default; }

  .hint {
    position: absolute;
    bottom: max(18px, env(safe-area-inset-bottom));
    font-size: .85rem;
    color: rgba(74, 44, 42, .45);
    z-index: 2;
  }

  body.revealed #stage {
    transform: scale(.4);
    opacity: 0;
    filter: blur(8px);
    pointer-events: none;
  }

  /* ---------- the flash ---------- */

  #flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, #fff 0, #FFF3C4 50%, #FFD43B 100%);
    opacity: 0;
    pointer-events: none;
    z-index: 50;
  }

  #flash.go { animation: flash 1.1s ease-out; }

  @keyframes flash {
    0%   { opacity: 0; }
    12%  { opacity: .85; }
    100% { opacity: 0; }
  }

  /* ---------- stage 2: the reveal ---------- */

  #reveal {
    position: fixed;
    inset: 0;
    display: flex;
    overflow-y: auto;
    padding: 24px 16px;
    background: linear-gradient(165deg, var(--night-1) 0%, var(--night-2) 55%, var(--night-3) 100%);
    color: #fff;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1s ease .25s, visibility 0s linear 1.25s;
    user-select: text;
    -webkit-user-select: text;
  }

  body.revealed #reveal { opacity: 1; visibility: visible; transition: opacity 1s ease .25s, visibility 0s; }

  .stars { position: fixed; inset: 0; pointer-events: none; }

  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #fff;
    animation: twinkle ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: .15; transform: scale(.6); }
    50%      { opacity: 1;   transform: scale(1.2); }
  }

  .reveal-inner {
    position: relative;
    margin: auto;
    width: 100%;
    max-width: 580px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .big { position: relative; transition: opacity .5s, transform .5s; }

  .heart-badge {
    position: relative;
    width: min(240px, 62vw);
    aspect-ratio: 1;
    margin: 0 auto;
    transform: scale(0);
  }

  body.revealed .heart-badge { animation: heartIn 1.1s cubic-bezier(.3,1.6,.5,1) .6s forwards, beat 1.4s ease-in-out 2s infinite; }

  @keyframes heartIn {
    0%   { transform: scale(0) rotate(-30deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.08); }
    30%      { transform: scale(.98); }
    45%      { transform: scale(1.05); }
  }

  .heart-badge svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 28px rgba(255, 111, 145, .8));
  }

  .heart-badge .num {
    position: absolute;
    inset: 0 0 12% 0;
    display: grid;
    place-items: center;
    font-size: min(130px, 34vw);
    font-weight: 700;
    line-height: 1;
    color: #fff;
    text-shadow: 0 4px 0 rgba(226, 62, 109, .6);
  }

  .big .label {
    margin-top: 10px;
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    font-weight: 600;
    letter-spacing: .02em;
    opacity: 0;
    transform: translateY(14px);
  }

  body.revealed .big .label { animation: fadeUp .8s ease 1.5s forwards; }

  .big .sub {
    margin-top: 4px;
    font-family: var(--font-hand);
    font-size: 1.5rem;
    color: #FFD6E0;
    opacity: 0;
  }

  body.revealed .big .sub { animation: fadeUp .8s ease 2s forwards; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .env-area {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: max-height 1s ease, opacity .8s ease .3s, margin .8s;
  }

  #reveal.stage2 .env-area { max-height: 340px; opacity: 1; margin-top: 34px; overflow: visible; }

  .envelope {
    position: relative;
    width: 260px;
    height: 170px;
    border: none;
    background: none;
    cursor: pointer;
    perspective: 800px;
    animation: hover 2.2s ease-in-out infinite;
    touch-action: manipulation;
  }

  .envelope:focus-visible { outline: 3px dashed #fff; outline-offset: 10px; border-radius: 12px; }

  @keyframes hover {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50%      { transform: translateY(-8px) rotate(1.5deg); }
  }

  .envelope span { position: absolute; display: block; }

  .env-back {
    inset: 0;
    background: #F79AB2;
    border-radius: 12px;
    z-index: 1;
  }

  .env-letter {
    left: 14px; right: 14px; top: 12px; bottom: 12px;
    background: var(--paper);
    border-radius: 8px;
    z-index: 2;
    transition: transform .8s cubic-bezier(.3,1.3,.5,1) .35s;
    background-image: repeating-linear-gradient(transparent 0 18px, rgba(255, 92, 138, .18) 18px 19px);
    background-position: 0 30px;
  }

  .env-front {
    inset: 0;
    background: #FFC2D1;
    border-radius: 12px;
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
    z-index: 3;
    box-shadow: 0 20px 40px rgba(0, 0, 0, .25);
  }

  .env-flap {
    left: 0; right: 0; top: 0;
    height: 62%;
    background: #FF9BB3;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    z-index: 4;
    border-radius: 12px 12px 0 0;
    transition: transform .6s ease, z-index 0s linear .3s;
  }

  .seal {
    left: 50%; top: 62%;
    width: 46px; height: 46px;
    margin: -23px 0 0 -23px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FF7AA0, var(--rose-deep));
    color: #fff;
    font-size: 22px;
    line-height: 46px;
    z-index: 5;
    box-shadow: 0 3px 8px rgba(0, 0, 0, .25);
    transition: transform .3s, opacity .3s;
  }

  .envelope.open { animation: none; }
  .envelope.open .seal { transform: scale(0); opacity: 0; }
  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 0; }
  .envelope.open .env-letter { transform: translateY(-90px); }

  .tap-hint {
    margin-top: 18px;
    font-size: 1.05rem;
    color: #FFE1E8;
    animation: nudge 1.6s ease-in-out infinite;
  }

  @keyframes nudge {
    0%, 100% { opacity: .55; }
    50%      { opacity: 1; }
  }

  #reveal.opening .big,
  #reveal.opening .env-area { opacity: 0; transform: translateY(-30px); transition: opacity .5s ease .9s, transform .5s ease .9s; }

  #reveal.read .big,
  #reveal.read .env-area { display: none; }

  .letter {
    display: none;
    position: relative;
    width: 100%;
    margin-top: 70px;
    padding: 40px 28px 34px;
    background: var(--paper);
    color: var(--ink);
    border-radius: 22px;
    text-align: left;
    box-shadow: 0 30px 80px rgba(20, 0, 40, .45);
  }

  #reveal.read .letter { display: block; animation: letterIn .9s cubic-bezier(.3,1.3,.5,1); }

  @keyframes letterIn {
    from { opacity: 0; transform: translateY(60px) scale(.9) rotate(-2deg); }
    to   { opacity: 1; transform: none; }
  }

  .letter .mini-chick {
    position: absolute;
    top: -78px;
    right: 22px;
    width: 100px;
    height: 100px;
    animation: peek 2.4s ease-in-out infinite;
  }

  .letter .mini-chick svg { width: 100%; height: 100%; overflow: visible; }

  @keyframes peek {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-6px) rotate(4deg); }
  }

  .letter .date {
    font-size: .85rem;
    font-weight: 600;
    letter-spacing: .25em;
    color: var(--rose);
  }

  .letter h1 {
    margin-top: 6px;
    font-size: clamp(1.7rem, 6.5vw, 2.3rem);
    font-weight: 700;
    line-height: 1.15;
    text-wrap: balance;
  }

  .letter h1 .her { color: var(--rose); }

  .message {
    margin-top: 18px;
    font-family: "Noto Sans Georgian", var(--font-ui);
    font-size: 1.2rem;
    font-weight: 500;
    line-height: 38px;
    background-image: repeating-linear-gradient(transparent 0 36px, rgba(255, 92, 138, .16) 36px 37px, transparent 37px 38px);
  }

  .message p { opacity: 0; animation: fadeUp .8s ease forwards; }
  .message p + p { margin-top: 38px; }

  .letter .sign {
    margin-top: 26px;
    text-align: right;
    font-family: var(--font-hand);
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--rose-deep);
    opacity: 0;
    animation: fadeUp .8s ease forwards;
  }

  .replay {
    display: none;
    margin: 22px auto 8px;
    font: inherit;
    font-size: .95rem;
    color: #FFE1E8;
    background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 255, 255, .25);
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
  }

  #reveal.read .replay { display: block; }

  #fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 60;
  }

  @media (min-width: 700px) {
    .chick-wrap { width: 250px; height: 250px; }
    .letter { padding: 48px 48px 40px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #chick, .floaty, .envelope, .letter .mini-chick, .heart-badge { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<main id="stage">
  <div class="speech" id="speech">psst… whatever you do, don't click me 🙈</div>

  <div class="chick-wrap" id="chickWrap">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <radialGradient id="bodyGrad" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="#FFF08A"/>
          <stop offset=".6" stop-color="#FFD43B"/>
          <stop offset="1" stop-color="#F5B700"/>
        </radialGradient>
        <radialGradient id="irisGrad" cx="50%" cy="38%" r="65%">
          <stop offset="0" stop-color="#8FDBFF"/>
          <stop offset=".55" stop-color="#2F8BE0"/>
          <stop offset="1" stop-color="#1A4C93"/>
        </radialGradient>
        <radialGradient id="curlGrad" cx="35%" cy="30%" r="75%">
          <stop offset="0" stop-color="#A86F47"/>
          <stop offset=".55" stop-color="#744629"/>
          <stop offset="1" stop-color="#4E2D1A"/>
        </radialGradient>
      </defs>
      <g id="chick">
        <ellipse id="shadow" cx="100" cy="190" rx="52" ry="7" fill="rgba(74,44,42,.10)"/>
        <!-- feet -->
        <g id="feet" fill="none" stroke="#FF9F1C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M82 170 L80 186 M80 186 L72 190 M80 186 L82 192 M80 186 L88 190"/>
          <path d="M118 170 L120 186 M120 186 L112 190 M120 186 L118 192 M120 186 L128 190"/>
        </g>
        <!-- wings -->
        <g id="wingGL" transform="rotate(18 40 122)"><ellipse id="wingL" class="wing" cx="40" cy="122" rx="15" ry="27" fill="#F5C518"/></g>
        <g id="wingGR" transform="rotate(-18 160 122)"><ellipse id="wingR" class="wing" cx="160" cy="122" rx="15" ry="27" fill="#F5C518"/></g>
        <!-- body -->
        <ellipse id="bodyShape" cx="100" cy="114" rx="64" ry="64" fill="url(#bodyGrad)"/>
        <ellipse id="belly" cx="100" cy="146" rx="36" ry="24" fill="#FFF2A8" opacity=".55"/>
        <ellipse id="shine" cx="50" cy="100" rx="9" ry="5" fill="#fff" opacity="0" transform="rotate(-60 50 100)"/>
        <!-- brown curls (drawn by the script) -->
        <g id="hair"></g>
        <!-- cheeks -->
        <ellipse class="cheek" cx="64" cy="122" rx="11" ry="7" fill="#FF8FAB"/>
        <ellipse class="cheek" cx="136" cy="122" rx="11" ry="7" fill="#FF8FAB"/>
        <!-- eyes -->
        <g id="eyesOpen">
          <circle cx="78" cy="104" r="11" fill="#2A1B14"/>
          <circle cx="122" cy="104" r="11" fill="#2A1B14"/>
          <g id="pupils">
            <circle cx="78" cy="104" r="9" fill="url(#irisGrad)"/>
            <circle cx="122" cy="104" r="9" fill="url(#irisGrad)"/>
            <path d="M70.5 106.5 Q78 114 85.5 106.5 Q78 110.5 70.5 106.5 Z" fill="#A8E6FF" opacity=".8"/>
            <path d="M114.5 106.5 Q122 114 129.5 106.5 Q122 110.5 114.5 106.5 Z" fill="#A8E6FF" opacity=".8"/>
            <circle cx="78" cy="104" r="4.2" fill="#0D1B2E"/>
            <circle cx="122" cy="104" r="4.2" fill="#0D1B2E"/>
            <circle cx="74.2" cy="100.2" r="3.4" fill="#fff"/>
            <circle cx="118.2" cy="100.2" r="3.4" fill="#fff"/>
            <circle cx="81.4" cy="107.4" r="1.5" fill="#fff"/>

<script>
  // ✏️ Everything personal lives here.

    "კარგად გავატაროთ ჩვენი პირველი ზამთარი! ❤️ 😛 ❤️ ❤️"

  ];

  function buttonText(n) {
    if (n < 12) return "don't click me";
    if (n < 26) return "i said DON'T";
    if (n < 38) return "stop inflating me!";
    if (n < 47) return "ok… click me 👀";
    return "don't you dare";
  }

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), speech = $("speech"), btn = $("btn"), chickWrap = $("chickWrap");
  const chick = $("chick"), pupils = $("pupils"), hint = $("hint");
  const reveal = $("reveal"), envelope = $("envelope"), flash = $("flash");

  let clicks = 0;
  let done = false;

  // ---------- particles ----------
  const canvas = $("fx");
  const ctx = canvas.getContext("2d");
  let particles = [];
  let running = false;
  let rainTimer = null;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  const CONFETTI = ["#FFD43B", "#FF5C8A", "#FFB5C5", "#FFFFFF", "#FF9F1C", "#B794F6", "#7FD8FF"];
  const FLUFF = ["#FFD43B", "#FFE58A", "#F5C518", "#FFF2A8"];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const angleDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

  function spawn(p) {
    particles.push(Object.assign({ rot: rand(0, Math.PI * 2), vr: rand(-.2, .2), life: 0, drag: .985, g: .25, flip: rand(0, Math.PI * 2) }, p));
    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  function drawHeart(s) {
    ctx.beginPath();
    ctx.moveTo(0, -s * .2);
    ctx.bezierCurveTo(0, -s * .5, -s * .5, -s * .5, -s * .5, -s * .2);
    ctx.bezierCurveTo(-s * .5, s * .1, 0, s * .3, 0, s * .5);
    ctx.bezierCurveTo(0, s * .3, s * .5, s * .1, s * .5, -s * .2);
    ctx.bezierCurveTo(s * .5, -s * .5, 0, -s * .5, 0, -s * .2);
    ctx.fill();
  }

  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    particles = particles.filter((p) => p.life < p.max && p.y < innerHeight + 60);
    for (const p of particles) {
      p.life++;
      p.vx *= p.drag; p.vy *= p.drag;
      p.vy += p.g;
      if (p.sway) p.vx += Math.sin(p.life / 20 + p.flip) * p.sway;
      p.x += p.vx; p.y += p.vy;
      p.rot += p.vr;
      const fade = Math.min(1, (p.max - p.life) / 30);
      ctx.save();
      ctx.globalAlpha = fade * (p.alpha ?? 1);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === "heart") {
        drawHeart(p.size);
      } else if (p.shape === "feather") {
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size * .3, p.size * .6, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.shape === "dot" || p.shape === "puff") {
        const r = p.size / 2 * (p.shape === "puff" ? 1 + p.life / p.max * 1.5 : 1);
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.scale(1, Math.cos(p.life / 6 + p.flip));
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      }
      ctx.restore();
    }
    if (particles.length) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  function pokeBurst(x, y) {
    for (let i = 0; i < 9; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(2, 6);
      const heart = Math.random() < .5;
      spawn({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3,
        size: heart ? rand(10, 16) : rand(8, 12),
        color: heart ? pick(["#FF5C8A", "#FFB5C5"]) : pick(FLUFF),
        shape: heart ? "heart" : "feather",
        g: .18, max: 60, vr: rand(-.1, .1)
      });
    }
  }

  function confetti(x, y, n, power = 14) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(power * .3, power);
      const heart = Math.random() < .3;
      spawn({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - power * .35,
        size: heart ? rand(12, 22) : rand(8, 14),
        color: heart ? pick(["#FF5C8A", "#FF8FAB", "#FFB5C5"]) : pick(CONFETTI),
        shape: heart ? "heart" : "rect",
        g: .22, drag: .975, max: rand(140, 220), sway: .03
      });
    }
  }

  // fluff and a few curls fly off when it pops
  function featherBurst(x, y, spread) {
    for (let i = 0; i < 56; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(4, 14);
      const curl = i % 5 === 0;
      spawn({
        x: x + Math.cos(a) * rand(0, spread * .3), y: y + Math.sin(a) * rand(0, spread * .3),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
        size: curl ? rand(8, 13) : rand(14, 28), color: curl ? pick(["#744629", "#4E2D1A", "#A86F47"]) : pick(FLUFF),
        shape: curl ? "dot" : "feather", g: curl ? .2 : .05, drag: .95, max: rand(160, 280), sway: curl ? 0 : .05, vr: rand(-.08, .08)
      });
    }
  }

  // air rushing out of the balloon
  function puff(x, y, heading) {
    spawn({
      x, y,
      vx: -Math.cos(heading) * rand(2, 5) + rand(-1, 1), vy: -Math.sin(heading) * rand(2, 5) + rand(-1, 1),
      size: rand(6, 14), color: "#FFFFFF", shape: "puff", g: -.02, drag: .93, max: 34, alpha: .7
    });
  }

  function rainHearts() {
    rainTimer = setInterval(() => {
      if (particles.length > 160) return;
      spawn({
        x: rand(0, innerWidth), y: -20, vx: rand(-.4, .4), vy: rand(.6, 1.4),
        size: rand(10, 20), color: pick(["#FF5C8A", "#FF8FAB", "#FFB5C5", "#FFD43B"]),
        shape: "heart", g: .004, drag: 1, max: 1200, sway: .02, alpha: .75, vr: rand(-.02, .02)
      });
    }, 260);
  }

  // ---------- stage 1 ----------
  // cartoon curls: a dark cap, round curls with a swirl and a shine, a spring curl on top and two bouncy ones at the sides
  (function drawHair() {
    const NS = "http://www.w3.org/2000/svg";
    const hair = $("hair");
    const add = (tag, attrs) => {
      const el = document.createElementNS(NS, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      hair.appendChild(el);
    };
    const swirl = (cx, cy, r) => {
      let d = "";
      for (let i = 0; i <= 24; i++) {
        const th = -Math.PI * .2 + (i / 24) * Math.PI * 2.4;
        const rr = r * (.62 - (i / 24) * .45);
        d += (i ? "L" : "M") + (cx + Math.cos(th) * rr).toFixed(1) + " " + (cy + Math.sin(th) * rr).toFixed(1);
      }
      return d;
    };
    const curl = (cx, cy, r) => {
      add("circle", { cx, cy, r, fill: "url(#curlGrad)" });
      add("path", { d: swirl(cx + r * .05, cy + r * .05, r), fill: "none", stroke: "#3B2213", "stroke-width": (r * .15).toFixed(1), "stroke-linecap": "round", "stroke-linejoin": "round" });
      add("path", { d: `M${cx - r * .62} ${cy - r * .18} A${r * .66} ${r * .66} 0 0 1 ${cx - r * .12} ${cy - r * .64}`, fill: "none", stroke: "#D9A77A", "stroke-width": (r * .13).toFixed(1), "stroke-linecap": "round", opacity: ".8" });
    };
    const spring = (d) => add("path", { d, fill: "none", stroke: "#6B4127", "stroke-width": 4.5, "stroke-linecap": "round", "stroke-linejoin": "round" });

    spring("M50 80 q-8 5 0 9 q8 4 0 9 q-8 4 0 9");
    spring("M150 80 q8 5 0 9 q-8 4 0 9 q8 4 0 9");
    add("path", { d: "M44 86 C40 52 64 34 100 34 C136 34 160 52 156 86 C148 76 134 72 120 74 C110 66 90 66 80 74 C66 72 52 76 44 86 Z", fill: "#4A2B19" });
    spring("M98 28 C96 14 110 6 116 14 C122 22 110 28 107 21 C104 15 112 12 114 17");
    // outer ring, then the middle, then the fringe on top
    for (const [x, y, r] of [
      [50, 78, 12], [56, 60, 13], [70, 46, 14], [88, 38, 14], [106, 36, 14], [124, 40, 14], [139, 50, 13], [147, 64, 12], [150, 80, 11],
      [80, 54, 12], [100, 50, 12], [120, 54, 12],
      [64, 74, 10], [81, 70, 10.5], [100, 68, 10.5], [119, 70, 10.5], [136, 74, 10]
    ]) curl(x, y, r);
  })();
  for (let i = 0; i < 14; i++) {
    const h = document.createElement("span");
    h.className = "floaty";
    h.textContent = pick(["♥", "♡", "✿"]);
    h.style.left = rand(0, 100) + "%";
    h.style.fontSize = rand(12, 28) + "px";
    h.style.animationDuration = rand(10, 20) + "s";
    h.style.animationDelay = -rand(0, 20) + "s";
    stage.appendChild(h);
  }

  function say(text) {
    speech.textContent = text;
    speech.classList.remove("pop");
    void speech.offsetWidth;
    speech.classList.add("pop");
  }

  let happyTimer;
  function react() {
    chick.classList.remove("squish", "tight");
    void chick.getBoundingClientRect();
    chick.classList.add("squish", "happy");
    clearTimeout(happyTimer);
    happyTimer = setTimeout(() => {
      chick.classList.remove("happy", "squish");
      if (clicks > TOTAL * .55) chick.classList.add("tight");
    }, 450);
  }

  // How big the chick may get before it would leave the screen.
  function maxGrow() {
    const r = chickWrap.getBoundingClientRect();
    const base = chickWrap.offsetWidth;
    return Math.max(1.3, Math.min(2.4, (innerWidth * 1.05) / base, (r.bottom - 8) / base));
  }

  // t goes 0 → 1: the body swells, the curls stretch with it, wings and feet get pushed out, a balloon shine appears.
  function shapeInflate(t) {
    const set = (id, attrs) => { const el = $(id); for (const k in attrs) el.setAttribute(k, attrs[k]); };
    set("bodyShape", { rx: 64 + 20 * t, ry: 64 + 15 * t, cy: 114 - 3 * t });
    set("belly", { rx: 36 + 14 * t, ry: 24 + 8 * t, cy: 146 + 4 * t });
    set("shine", { opacity: Math.max(0, (t - .25) * .9), rx: 9 + 6 * t, ry: 5 + 3 * t, cx: 50 - 10 * t, transform: `rotate(-60 ${50 - 10 * t} 100)` });
    set("wingGL", { transform: `translate(${-20 * t} ${-6 * t}) rotate(${18 + 40 * t} 40 122)` });
    set("wingGR", { transform: `translate(${20 * t} ${-6 * t}) rotate(${-18 - 40 * t} 160 122)` });
    set("feet", { transform: `translate(0 ${10 * t})` });
    set("hair", { transform: `translate(0 ${-3 * t}) translate(100 114) scale(${1 + .31 * t} ${1 + .23 * t}) translate(-100 -114)` });
    set("shadow", { rx: 52 + 26 * t, cy: 190 + 8 * t });
    chickWrap.querySelectorAll(".cheek").forEach((c, i) => {
      c.setAttribute("rx", 11 + 6 * t);
      c.setAttribute("ry", 7 + 3 * t);
      c.setAttribute("cx", i ? 136 + 10 * t : 64 - 10 * t);
    });
  }

  function inflate(t) {
    shapeInflate(t);
    const grow = 1 + (maxGrow() - 1) * t;
    chickWrap.style.setProperty("--grow", grow);
    chick.style.setProperty("--amp", (t * 2).toFixed(2) + "px");
    // keep the bubble above the chick's eyes as it swells
    const lift = Math.min((grow - 1) * chickWrap.offsetHeight * .6, speech.offsetTop - 12);
    speech.style.translate = `0 ${-Math.max(0, lift)}px`;
  }

  function poke(e) {
    if (done) return;
    clicks++;

    let x = e.clientX, y = e.clientY;
    if (!x && !y) {
      const r = chickWrap.getBoundingClientRect();
      x = r.left + r.width / 2; y = r.top + r.height / 2;
    }
    pokeBurst(x, y);
    react();

    hint.style.opacity = 0;

    inflate(Math.min(1, clicks / (TOTAL - 1)));
    chickWrap.style.setProperty("--blush-amt", Math.min(1, .4 + clicks * .013));

    btn.textContent = buttonText(clicks);
    const wild = Math.min(1, clicks / 30);
    btn.style.setProperty("--dx", rand(-14, 14) * wild + "px");
    btn.style.setProperty("--dy", rand(-6, 6) * wild + "px");
    btn.style.setProperty("--rot", rand(-6, 6) * wild + "deg");

    if (navigator.vibrate) navigator.vibrate(12);

    if (clicks >= TOTAL) finale();
    else say(LINES[clicks - 1]);
  }

  btn.addEventListener("click", poke);
  chickWrap.addEventListener("click", poke);

  addEventListener("pointermove", (e) => {
    if (done) return;
    const r = chickWrap.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height * .4);
    const d = Math.hypot(dx, dy) || 1;
    const m = Math.min(1.6, d / 60);
    pupils.setAttribute("transform", `translate(${(dx / d) * m} ${(dy / d) * m})`);
  });

  // ---------- the big moment ----------
  function finale() {
    done = true;
    btn.disabled = true;
    btn.textContent = "uh oh…";
    say("i'm gonna… i'm gonna… 😱");
    clearTimeout(happyTimer);
    chick.classList.remove("squish", "tight");
    chick.classList.add("happy");
    chickWrap.classList.add("charge");

    setTimeout(() => {
      const r = chickWrap.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height * .55;
      speech.style.visibility = "hidden";
      btn.textContent = "noooo!";
      flash.classList.add("go");

      const word = document.createElement("div");
      word.className = "pop-text";
      word.textContent = "POP!";
      const ring = document.createElement("div");
      ring.className = "shock";
      for (const el of [word, ring]) {
        el.style.left = cx + "px";
        el.style.top = cy + "px";
        document.body.appendChild(el);
      }
      setTimeout(() => { word.remove(); ring.remove(); }, 1200);

      featherBurst(cx, cy, r.width);
      confetti(cx, cy, 110, 16);
      if (navigator.vibrate) navigator.vibrate([60, 30, 120]);

      flyAway(r, () => {
        confetti(innerWidth * .15, innerHeight * .9, 60, 16);
        confetti(innerWidth * .85, innerHeight * .9, 60, 16);
        document.body.classList.add("revealed");
        setTimeout(() => reveal.classList.add("stage2"), 3200);
      });
    }, 1300);
  }

  // Deflate like a let-go balloon: zip around the screen leaking air, shrink, then float up and away.
  function flyAway(r, onGone) {
    const W = chickWrap.offsetWidth;
    let x = r.left + r.width / 2, y = r.top + r.height / 2;
    let vx = 0, vy = 0, heading = -Math.PI / 2 + rand(-.8, .8), turn = 0, rot = 0;
    const s0 = r.width / W, sEnd = .45, AIR = 2.6;
    const place = (s) => { chickWrap.style.transform = `translate(${x - W / 2}px, ${y - W / 2}px) rotate(${rot}rad) scale(${s})`; };

    chickWrap.classList.remove("charge");
    chick.classList.add("flying");
    $("shadow").style.display = "none";
    Object.assign(chickWrap.style, { position: "fixed", left: "0", top: "0", margin: "0", zIndex: 56, transition: "none", transformOrigin: "50% 50%" });
    place(s0);
    document.body.appendChild(chickWrap);

    const t0 = performance.now();
    let frames = 0;
    function step(now) {
      const air = Math.max(0, 1 - (now - t0) / 1000 / AIR);
      const s = sEnd + (s0 - sEnd) * Math.pow(air, .6);
      const half = W * s / 2;

      if (air > 0) {
        turn = (turn + rand(-.12, .12)) * .9;
        heading += turn;
        // bounce back toward the middle instead of leaving the screen early
        if (x < half || x > innerWidth - half || y < half || y > innerHeight - half) {
          heading += angleDiff(Math.atan2(innerHeight / 2 - y, innerWidth / 2 - x), heading) * .2;
        }
        const thrust = .5 + 1.5 * air;
        vx += Math.cos(heading) * thrust;
        vy += Math.sin(heading) * thrust;
        if (Math.random() < .85) puff(x - Math.cos(heading) * half * .9, y - Math.sin(heading) * half * .9, heading);
      } else {
        // out of air: drift up and away
        vy -= .8;
        vx += Math.sin(now / 150) * .3;
      }
      vx *= .9; vy *= .9;
      x += vx; y += vy;
      rot += angleDiff((air > 0 ? heading : -Math.PI / 2) + Math.PI / 2, rot) * .25;

      place(s);
      // the fluffy filters are heavy, so reshape every other frame
      if (++frames % 2 === 0) shapeInflate(air);

      if (y < -W * s) {
        chickWrap.style.visibility = "hidden";
        onGone();
        return;
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // stars
  const stars = $("stars");
  for (let i = 0; i < 70; i++) {
    const s = document.createElement("span");
    s.className = "star";
    s.style.left = rand(0, 100) + "%";
    s.style.top = rand(0, 100) + "%";
    const size = rand(1.5, 3.5);
    s.style.width = s.style.height = size + "px";
    s.style.animationDuration = rand(2, 5) + "s";
    s.style.animationDelay = -rand(0, 5) + "s";
    stars.appendChild(s);
  }

  // the letter
  $("herName").textContent = HER_NAME;
  $("sign").textContent = SIGNATURE;
  const mini = chickWrap.querySelector("svg").cloneNode(true);
  mini.querySelectorAll("[id]").forEach((el) => el.removeAttribute("id"));
  $("miniChick").appendChild(mini);

  envelope.addEventListener("click", () => {
    if (!reveal.classList.contains("stage2") || envelope.classList.contains("open")) return;
    envelope.classList.add("open");
    reveal.classList.add("opening");
    const r = envelope.getBoundingClientRect();
    setTimeout(() => confetti(r.left + r.width / 2, r.top + r.height / 3, 120, 13), 600);

    setTimeout(() => {
      const box = $("message");
      box.innerHTML = "";
      MESSAGE.forEach((line, i) => {
        const p = document.createElement("p");
        p.textContent = line;
        p.style.animationDelay = (0.7 + i * 0.9) + "s";
        box.appendChild(p);
      });
      $("sign").style.animationDelay = (0.7 + MESSAGE.length * 0.9 + .3) + "s";
      reveal.classList.add("read");
      reveal.scrollTop = 0;
      rainHearts();
    }, 1450);
  });

  $("replay").addEventListener("click", () => location.reload());
</script>
</body>
</html>
